{% extends 'core/layout.html' %}
{% load static %}

{% block title %}
Dashboard
{% endblock %}

{% block content %}
    <main>
        <div class=" bg-gray-300">
            <h1 class="p-5 text-xl under text-center"><b>Mi Dashboard</b></h1>
            <div class="m-2 rounded-xl">
                <h1 class="text-center text-2xl pb-16">Bienvenido a tu dashboard <b>{{ request.user.first_name }}</b>!</h1>
            </div>
        </div>
        <div class="mt-5">
            <div class="flex justify-center">
                <div class="grid grid-cols-2 gap-26 p-5 justify-center">
                    <div class="flex bg-slate-200 rounded-xl p-2 w-3/4 transform transition-transform duration-300 hover:scale-105 hover:shadow-sm">
                        <a href="{% url 'translator' %}">
                            <img class="w-1/3 mx-auto mb-2" src="{% static 'core/images/translateLogo.png' %}" alt="traductor">
                            <h1 class="text-2xl text-center">Traductor</h1>
                        </a>
                    </div>
                    <div class="flex flex-col justify-center align-middle bg-slate-200 rounded-xl text-center w-3/4 transform transition-transform duration-300 hover:scale-105 hover:shadow-sm">
                        <a href="{% url 'chat' %}">
                            <img class="w-1/3 mx-auto mb-2" src="{% static 'core/images/chatLogo.png' %}" alt="chat">
                            <h1 class="text-2xl ">Chat</h1>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>
{% endblock %}
